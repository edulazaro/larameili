name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        testbench: ['^8.0', '^9.0', '^10.0']
        exclude:
          # Laravel 10 (testbench 8) does not support PHP 8.4.
          - php: '8.4'
            testbench: '^8.0'

    name: unit / PHP ${{ matrix.php }} - Testbench ${{ matrix.testbench }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, curl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --prefer-dist --prefer-stable --no-interaction --no-progress --with-all-dependencies

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

  integration:
    runs-on: ubuntu-latest

    name: integration / Meilisearch

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_MASTER_KEY: masterKey
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700

    env:
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_KEY: masterKey

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, curl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Wait for Meilisearch
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:7700/health && break
            sleep 1
          done

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite integration
