name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly run, so a new Laravel or PHP release that breaks the package
    # shows up here instead of in someone's application.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    name: Resolve matrix
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Resolve supported PHP and Laravel versions
        id: resolve
        run: |
          php -r '
            $minLaravel = 11;

            // The floor comes from the package itself, so bumping composer.json
            // is enough and this workflow never has to be edited alongside it.
            $composer = json_decode(file_get_contents("composer.json"), true);
            preg_match("/(\d+\.\d+)/", $composer["require"]["php"], $m);
            $packageMinPhp = $m[1] ?? "8.4";

            // Every PHP branch still receiving releases, straight from php.net.
            // A new minor shows up here on its own, an EOL one drops off.
            $active = json_decode(file_get_contents("https://www.php.net/releases/active.php?json=1"), true);
            $phpVersions = array_keys($active[8] ?? []);
            sort($phpVersions);

            // Every Laravel major from $minLaravel up, with the PHP it requires.
            $releases = json_decode(file_get_contents("https://repo.packagist.org/p2/laravel/framework.json"), true);
            $majors = [];
            foreach ($releases["packages"]["laravel/framework"] as $release) {
                if (str_contains($release["version"], "-")) {
                    continue;
                }
                if (! preg_match("/^v(\d+)\./", $release["version"], $m)) {
                    continue;
                }
                $major = (int) $m[1];
                if ($major < $minLaravel || isset($majors[$major])) {
                    continue;
                }
                $majors[$major] = $release["require"]["php"] ?? "^8.0";
            }
            ksort($majors);

            $include = [];
            foreach ($majors as $major => $phpConstraint) {
                preg_match("/(\d+\.\d+)/", $phpConstraint, $m);
                $minPhp = $m[1] ?? "8.0";

                // Laravel 11 accepts PHP 8.2, but this package does not, so the
                // stricter of the two floors wins.
                if (version_compare($packageMinPhp, $minPhp, ">")) {
                    $minPhp = $packageMinPhp;
                }

                foreach ($phpVersions as $php) {
                    if (version_compare($php, $minPhp, "<")) {
                        continue;
                    }

                    $include[] = [
                        "php" => $php,
                        "laravel" => "{$major}.*",
                        // Testbench majors track Laravel majors two behind:
                        // Laravel 11 to Testbench 9, 12 to 10, 13 to 11.
                        "testbench" => ($major - 2) . ".*",
                    ];
                }
            }

            file_put_contents(getenv("GITHUB_OUTPUT"), "matrix=" . json_encode(["include" => $include]) . PHP_EOL, FILE_APPEND);

            fwrite(STDERR, count($include) . " combinations: " . json_encode($include, JSON_PRETTY_PRINT) . PHP_EOL);
          '

  unit:
    needs: matrix
    runs-on: ubuntu-latest
    name: unit / PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, curl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --dev --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --prefer-stable --no-interaction --no-progress --with-all-dependencies

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

  integration:
    runs-on: ubuntu-latest
    name: integration / Meilisearch

    services:
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_MASTER_KEY: masterKey
          MEILI_NO_ANALYTICS: 'true'
        ports:
          - 7700:7700

    env:
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_KEY: masterKey

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, json, curl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Wait for Meilisearch
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:7700/health && break
            sleep 1
          done

      - name: Run integration tests
        run: vendor/bin/phpunit --testsuite integration

  next:
    # Early warning for what is not released yet: the PHP master branch and
    # the next Laravel. Reported, never blocking.
    runs-on: ubuntu-latest
    continue-on-error: true
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'PHP nightly'
            php: 'nightly'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, curl
          coverage: none

      - name: Install dependencies
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies --ignore-platform-req=php+

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit
